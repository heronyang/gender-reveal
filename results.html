<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>多多投票結果</title>
<link rel="icon" href="bottle-red.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Huninn&family=Noto+Sans+TC:wght@400;700&display=swap">
<link rel="stylesheet" href="style.css">
<style>
  .panel { background: var(--surface); border-radius: var(--radius); padding: 20px; display: grid; gap: 16px; box-shadow: var(--shadow); }
  .row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between; }
  .seg { display: inline-flex; border: 1.5px solid var(--line); border-radius: 999px; overflow: hidden; }
  .seg button { font: inherit; border: 0; background: transparent; color: var(--ink); padding: 8px 18px; cursor: pointer; }
  .seg button[aria-pressed="true"].boy { background: var(--boy); color: var(--surface); }
  .seg button[aria-pressed="true"].girl { background: var(--girl); color: var(--surface); }
  .drum {
    font-family: var(--font-display); font-size: clamp(2rem, 9vw, 3.4rem); text-align: center;
    padding: 24px 8px; border-radius: var(--radius); background: var(--spring-soft); color: var(--spring);
    min-height: 1.3em; overflow-wrap: anywhere;
  }
  .drum.won { animation: pop .5s ease-out; }
  @keyframes pop { 0% { transform: scale(.9) } 60% { transform: scale(1.06) } 100% { transform: scale(1) } }
  .pool { font-size: .9rem; color: var(--muted); }
  .status { font-size: .82rem; color: var(--muted); }
</style>
</head>
<body>
<main class="wide">
  <header class="hero">
    <div class="hero-text">
      <p class="eyebrow">主辦人專用</p>
      <h1><span class="name">多多</span>投票結果與抽獎</h1>
      <p class="status" id="status">讀取中…</p>
    </div>
    <div class="duck-wrap">
      <span class="bubble" id="bubble">誰會猜對呢？</span>
      <div class="bottles">
        <img class="duck" src="bottle-blue.svg" alt="藍色的多多小瓶子" width="80" height="135">
        <img class="duck alt" src="bottle-red.svg" alt="紅色的多多小瓶子" width="80" height="135">
      </div>
    </div>
  </header>

  <section class="panel" aria-label="目前票數">
    <div class="row"><h2>目前票數</h2><button class="ghost" id="refresh" type="button">重新整理</button></div>
    <div id="tally" class="tally"></div>
  </section>

  <section class="panel" aria-label="抽獎">
    <h2>揭曉與抽獎：煙波溫泉住宿券</h2>
    <div class="row">
      <span>多多其實是：</span>
      <div class="seg" role="group" aria-label="選擇揭曉結果">
        <button type="button" class="boy" data-g="boy" aria-pressed="false">男生</button>
        <button type="button" class="girl" data-g="girl" aria-pressed="false">女生</button>
      </div>
    </div>
    <p class="pool" id="pool">先選擇揭曉結果，就會列出可以參加抽獎的人。</p>
    <div class="drum" id="drum" aria-live="polite">?</div>
    <button class="primary" id="draw" type="button" disabled>開始抽獎</button>
  </section>

  <section class="panel" aria-label="大家的理由">
    <h2>大家的理由</h2>
    <ul id="reasons" class="reasons"></ul>
  </section>
</main>

<script src="config.js"></script>
<script src="app.js"></script>
<script>
(function () {
  let votes = [];
  let answer = null;
  const statusEl = document.getElementById("status");
  const drawBtn = document.getElementById("draw");
  const drum = document.getElementById("drum");
  const poolEl = document.getElementById("pool");

  function winners() { return votes.filter(v => v.guess === answer); }

  function updatePool() {
    if (!answer) return;
    const w = winners();
    poolEl.textContent = w.length
      ? `猜對的有 ${w.length} 位：${w.map(v => v.name).join("、")}`
      : "沒有人猜對…這次獎品留給爸媽自己去泡湯吧！";
    drawBtn.disabled = w.length === 0;
  }

  async function load() {
    if (!window.VOTE_API_URL) { statusEl.textContent = "尚未設定：請在 config.js 填入 Google Apps Script 網址。"; return; }
    try {
      votes = await fetchVotes();
      renderTally(document.getElementById("tally"), votes);
      renderReasons(document.getElementById("reasons"), votes);
      updatePool();
      statusEl.textContent = "最後更新：" + new Date().toLocaleTimeString("zh-TW") + "（每 30 秒自動更新）";
    } catch (e) {
      statusEl.textContent = "讀取失敗：" + e.message;
    }
  }

  document.querySelectorAll(".seg button").forEach(b => b.addEventListener("click", () => {
    answer = b.dataset.g;
    document.querySelectorAll(".seg button").forEach(x => x.setAttribute("aria-pressed", String(x === b)));
    drum.textContent = "?"; drum.classList.remove("won");
    updatePool();
  }));

  function rand(n) {
    const a = new Uint32Array(1); crypto.getRandomValues(a); return a[0] % n;
  }

  drawBtn.addEventListener("click", () => {
    const pool = winners();
    if (!pool.length) return;
    drawBtn.disabled = true;
    drum.classList.remove("won");
    const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
    const final = pool[rand(pool.length)];
    let steps = reduce ? 0 : 28, delay = 50;
    (function spin() {
      if (steps-- > 0) {
        drum.textContent = pool[rand(pool.length)].name;
        delay *= 1.09;
        setTimeout(spin, delay);
      } else {
        drum.textContent = "🎉 " + final.name + " 🎉";
        drum.classList.add("won");
        document.getElementById("bubble").textContent = "恭喜 " + final.name + "！";
        confetti(140);
        drawBtn.disabled = false;
        drawBtn.textContent = "再抽一次";
      }
    })();
  });

  document.getElementById("refresh").addEventListener("click", load);
  load();
  setInterval(load, 30000);
})();
</script>
</body>
</html>
